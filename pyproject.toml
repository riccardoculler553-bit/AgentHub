[project]
name = "devicelink"
version = "1.0.0"
description = "DeviceLink - multi-device WebSocket registration and connection management platform (V1.0)"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "SQLAlchemy>=2.0",
    "pymysql>=1.1",
    "alembic>=1.13",
    "websockets>=12",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2"]
agent = ["langgraph>=0.2", "langchain-core>=0.3", "langchain-openai>=0.2"]
dingtalk = ["dingtalk-stream>=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
