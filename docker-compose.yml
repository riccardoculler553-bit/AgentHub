services:
  mysql:
    image: mysql:8.4
    container_name: devicelink-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: datapilot
      MYSQL_USER: datapilot
      MYSQL_PASSWORD: DataPilot@2026
    volumes:
      - devicelink_mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  devicelink_mysql_data:
